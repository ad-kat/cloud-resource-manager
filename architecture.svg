<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" role="img">
<title>Cloud Resource Manager — architecture</title>
<desc>Browser calls FastAPI, which contains routers, APScheduler, pricing cache, and Prometheus. FastAPI connects to SQLite, Azure Retail API, and Webhook.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#665B6C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Background -->
<rect width="680" height="370" fill="#FBF7EF"/>

<!-- Client box -->
<rect x="250" y="16" width="180" height="40" rx="8" fill="#F3EBDC" stroke="#D7CDBD" stroke-width="0.5"/>
<text x="340" y="36" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#281B35">Browser / client</text>

<!-- Arrow client to FastAPI -->
<line x1="340" y1="56" x2="340" y2="82" stroke="#B6A2CF" stroke-width="1" marker-end="url(#arr)"/>

<!-- FastAPI dashed container -->
<rect x="30" y="82" width="620" height="162" rx="12" fill="none" stroke="#B6A2CF" stroke-width="1" stroke-dasharray="6 3"/>
<text x="68" y="97" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#665B6C">FastAPI application</text>

<!-- Separator 1 -->
<line x1="50" y1="110" x2="630" y2="110" stroke="#D7CDBD" stroke-width="0.5" stroke-dasharray="4 3"/>

<!-- Router boxes — violet -->
<rect x="60" y="117" width="108" height="40" rx="6" fill="#EDE8F5" stroke="#8B6BBF" stroke-width="0.5"/>
<text x="114" y="137" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3D2854">Resources</text>

<rect x="173" y="117" width="108" height="40" rx="6" fill="#EDE8F5" stroke="#8B6BBF" stroke-width="0.5"/>
<text x="227" y="137" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3D2854">Cost</text>

<rect x="286" y="117" width="108" height="40" rx="6" fill="#EDE8F5" stroke="#8B6BBF" stroke-width="0.5"/>
<text x="340" y="137" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3D2854">Dashboard</text>

<rect x="399" y="117" width="108" height="40" rx="6" fill="#EDE8F5" stroke="#8B6BBF" stroke-width="0.5"/>
<text x="453" y="137" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3D2854">Auth</text>

<rect x="512" y="117" width="108" height="40" rx="6" fill="#EDE8F5" stroke="#8B6BBF" stroke-width="0.5"/>
<text x="566" y="137" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#3D2854">Export</text>

<!-- Separator 2 -->
<line x1="50" y1="165" x2="630" y2="165" stroke="#D7CDBD" stroke-width="0.5" stroke-dasharray="4 3"/>

<!-- APScheduler — teal -->
<rect x="60" y="172" width="180" height="44" rx="6" fill="#E8F4F3" stroke="#276D6A" stroke-width="0.5"/>
<text x="150" y="189" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1A4745">APScheduler</text>
<text x="150" y="207" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#276D6A">5-min TTL enforcement</text>

<!-- Pricing cache — gold -->
<rect x="250" y="172" width="180" height="44" rx="6" fill="#FBF3E0" stroke="#8C6519" stroke-width="0.5"/>
<text x="340" y="189" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5A3F0A">Pricing cache</text>
<text x="340" y="207" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#8C6519">Azure refresh / 6 hr</text>

<!-- Prometheus — muted -->
<rect x="440" y="172" width="180" height="44" rx="6" fill="#F3EBDC" stroke="#D7CDBD" stroke-width="0.5"/>
<text x="530" y="189" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#281B35">Prometheus</text>
<text x="530" y="207" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#665B6C">Request metrics</text>

<!-- Arrows to external services -->
<line x1="150" y1="244" x2="150" y2="270" stroke="#B6A2CF" stroke-width="1" marker-end="url(#arr)"/>
<line x1="340" y1="244" x2="340" y2="270" stroke="#B6A2CF" stroke-width="1" marker-end="url(#arr)"/>
<line x1="530" y1="244" x2="530" y2="270" stroke="#B6A2CF" stroke-width="1" marker-end="url(#arr)"/>

<!-- SQLite — teal -->
<rect x="55" y="270" width="190" height="56" rx="8" fill="#E8F4F3" stroke="#276D6A" stroke-width="0.5"/>
<text x="150" y="291" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1A4745">SQLite</text>
<text x="150" y="310" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#276D6A">Persistent data store</text>

<!-- Azure Retail API — gold -->
<rect x="245" y="270" width="190" height="56" rx="8" fill="#FBF3E0" stroke="#8C6519" stroke-width="0.5"/>
<text x="340" y="291" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5A3F0A">Azure Retail API</text>
<text x="340" y="310" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#8C6519">Live prices, no auth</text>

<!-- Webhook — gold -->
<rect x="435" y="270" width="190" height="56" rx="8" fill="#FBF3E0" stroke="#8C6519" stroke-width="0.5"/>
<text x="530" y="291" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#5A3F0A">Webhook</text>
<text x="530" y="310" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#8C6519">Slack / Teams alerts</text>
</svg>
