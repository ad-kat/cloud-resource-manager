#version: "3.9"   # Compose file format version — 3.9 supports all v2 features

services:

  api:
    # Build the image from the Dockerfile in the current directory
    build:
      context: .
      dockerfile: Dockerfile

    # Name the resulting image so it's easy to reference
    image: cloud-resource-manager:latest

    # Map host port 8000 → container port 8000
    # Format: "HOST_PORT:CONTAINER_PORT"
    # You can change the left number if 8000 is already in use on your machine
    ports:
      - "8000:8000"

    # Mount a named volume at /app/data inside the container.
    # This means the SQLite DB file survives container restarts — without this
    # every `docker compose down` would wipe all your data.
    volumes:
      - db_data:/app/data

    # Environment variables passed into the container at runtime.
    # Overrides the defaults baked into the Dockerfile ENV instruction.
    environment:
      - DB_PATH=/app/data/resources.db
      - PYTHONUNBUFFERED=1

    # Restart policy — useful when running as a long-lived service
    restart: unless-stopped

    # Health check: Docker will call this every 30 s.
    # If it fails 3 times in a row, the container is marked "unhealthy".
    # This is the same pattern used by Kubernetes liveness probes.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 10s

# Named volume declaration — Docker manages the storage location on the host.
# Run `docker volume inspect cloud-resource-manager_db_data` to find the path.
volumes:
  db_data:
