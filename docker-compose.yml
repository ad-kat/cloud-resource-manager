services:
  api:
    build: .
    image: cloud-resource-manager:latest
    ports:
      - "8000:7860"
    environment:
      - DATABASE_URL=sqlite:////data/resources.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s